services:
  backend:
    build: ./Server
    container_name: Backend
    ports:
      - "5001:5000"
    env_file:
      - ./Server/.env
    volumes:
      - ./Server/uploads:/app/uploads
    depends_on:
      - mongo


  vite:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: Vite
    ports:
      - "5172:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://backend:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
  
  nginx:
    image: nginx:alpine
    container_name: Nginx
    ports:
      - "8080:80"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - vite

  mongo:
    image: mongo:latest
    container_name: Mongo
    ports:
        - "27018:27017"
    volumes:
        - mongo-data:/data/db
volumes:
  mongo-data: